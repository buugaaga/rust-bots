[package]
name = "rust-bots"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1.88"
config = "0.15.11"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
ta = "0.5.0"
anyhow = "1.0.98"
strum = "0.27.1"
strum_macros = "0.27.1"
chrono = "0.4.41"
hex = "0.4.3"
hmac = "0.12.1"
sha2 = "0.10.9"
